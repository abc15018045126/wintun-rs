[package]
name = "wintun-rs"
version = "0.0.6"
edition = "2024"
authors = ["abc15018045126", "WireGuard LLC", "Antigravity"]
description = "Native Safe Rust library and userspace bindings for Wintun (WireGuard) TUN devices on Windows."
license = "MIT"
repository = "https://github.com/abc15018045126/wintun-rs"
homepage = "https://github.com/abc15018045126/wintun-rs"
readme = "README.md"
keywords = ["wintun", "tun", "wireguard", "vpn", "windows"]
categories = ["network-programming", "os::windows-apis"]
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "build.rs",
    "exports.def",
    "Release/amd64/driver/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[lib]
name = "wintun"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
] }

[build-dependencies]


